name: 每日对账

# 每天跑一次 tools/reconcile.mjs：逐条 HEAD 线上媒体，
# 对象丢失 → 隐藏；大小不符 → 校正 bytes；正常 → 刷 verified_at。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   FOLIA_PASSWORD = 管理员密码（admin@folia.local 的登录密码）
# 之后可用 "Run workflow" 手动触发，或等每天 UTC 18:00（北京时间 02:00）自动跑。

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成核对结果
        env:
          FOLIA_PASSWORD: ${{ secrets.FOLIA_PASSWORD }}
        run: node tools/reconcile.mjs --apply
      - name: 保留 SQL 产物
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-sql
          path: reconcile.sql
          if-no-files-found: ignore
