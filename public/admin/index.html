<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>肥鱼之家 · 壁纸管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="boot" class="boot">正在连接…</div>

  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <h1>肥鱼之家 <span>壁纸管理</span></h1>
      <p class="muted" id="auth-hint">用管理员或编辑账号登录</p>

      <form id="login-form" class="stack">
        <label>账号
          <input id="login-email" type="text" autocomplete="username" required placeholder="用户名或邮箱">
        </label>
        <label>密码
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary" type="submit">登录</button>
      </form>

      <form id="setup-form" class="stack hidden">
        <label>初始化令牌
          <input id="setup-token" autocomplete="off" required placeholder="wrangler pages secret put BOOTSTRAP_TOKEN">
        </label>
        <label>管理员账号
          <input id="setup-email" type="text" autocomplete="username" required placeholder="用户名或邮箱">
        </label>
        <label>显示名
          <input id="setup-name" autocomplete="nickname" required placeholder="例如：站长">
        </label>
        <label>密码
          <input id="setup-password" type="password" autocomplete="new-password" required minlength="10" placeholder="至少 10 位，字母加数字/符号">
        </label>
        <button class="btn primary" type="submit">创建管理员</button>
      </form>

      <p class="muted small">登录状态保存在 HttpOnly Cookie；所有写操作都会校验同源与请求头。</p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <a class="brand" href="/" title="回到前台画廊">肥鱼之家<span>·后台</span></a>
      <nav class="nav">
        <button class="nav-item" data-view="wallpapers" type="button">作品</button>
        <button class="nav-item" data-view="categories" type="button">分类</button>
        <button class="nav-item" data-view="members" type="button" data-admin-only>成员</button>
        <button class="nav-item" data-view="audit" type="button" data-admin-only>审计</button>
        <a class="nav-item nav-back" href="/" title="回到前台画廊">← 前台</a>
      </nav>
      <div class="sidebar-foot">
        <div class="who">
          <strong id="who-name">—</strong>
          <span id="who-role" class="muted small">—</span>
        </div>
        <a class="btn ghost small" href="/" title="回到前台画廊">← 返回前台</a>
        <button id="btn-logout" class="btn ghost small" type="button">退出</button>
        <button id="btn-password" class="btn ghost small" type="button">改密码</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="view-title">壁纸</h2>
        <div class="topbar-right">
          <a class="btn small ghost topbar-back" href="/" title="回到前台画廊">← 前台</a>
          <div id="view-actions" class="topbar-actions"></div>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="./app.js" defer></script>
</body>
</html>
